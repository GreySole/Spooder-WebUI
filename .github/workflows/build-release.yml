name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Runs on every branch push - just proves the app still builds, doesn't publish anything.
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The module UIs are submodules under src/modules/installed, and prebuild's
          # generate-registry.js only registers what is on disk. Without this the build
          # succeeds with an empty registry and ships a WebUI with no module tabs at all.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # Runs only on version tags (v*.*.*) - builds, zips, and publishes a GitHub Release.
  build-and-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The module UIs are submodules under src/modules/installed, and prebuild's
          # generate-registry.js only registers what is on disk. Without this the build
          # succeeds with an empty registry and ships a WebUI with no module tabs at all.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Package build output
        run: |
          cd build
          zip -r "../spooder-webui-${{ github.ref_name }}.zip" .

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            "spooder-webui-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
